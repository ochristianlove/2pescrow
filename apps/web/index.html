<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <title>2Pescrow — P2P Escrow</title>
    <link rel="icon" href="/brand/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var c = window.crypto || {};
        if (!window.crypto) window.crypto = c;
        if (typeof c.randomUUID !== "function") {
          c.randomUUID = function () {
            var b = new Uint8Array(16);
            if (typeof c.getRandomValues === "function") c.getRandomValues(b);
            else for (var i = 0; i < 16; i++) b[i] = (Math.random() * 256) | 0;
            b[6] = (b[6] & 15) | 64;
            b[8] = (b[8] & 63) | 128;
            var h = Array.prototype.map.call(b, function (x) { return x.toString(16).padStart(2, "0"); }).join("");
            return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
          };
        }
      })();
    </script>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
