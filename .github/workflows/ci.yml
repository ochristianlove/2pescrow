name: CI

on:
  push:
    branches: [main, cursor/api-start-and-prisma-generate]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
        env:
          VITE_API_URL: https://api.45.90.223.177.sslip.io
      - run: npm run typecheck -w @2pescrow/mobile
      - run: npm run check:mobile-parity
      - run: npm run check:i18n
      - run: npm run check:android-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: 2pescrow-web
          path: apps/web/dist
          if-no-files-found: error
