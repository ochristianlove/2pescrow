name: CI

on:
  push:
    branches: [main, cursor/api-start-and-prisma-generate]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funding-regression:
    name: Ethereum funding and recovery regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twopescrow
          POSTGRES_PASSWORD: twopescrow
          POSTGRES_DB: twopescrow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U twopescrow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build -w @2pescrow/shared
      - run: npx tsx --test scripts/test-ethereum-funding.test.ts scripts/test-ethereum-recovery.test.ts scripts/test-funding-client.test.ts scripts/test-funding-journal.test.ts

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
        env:
          VITE_API_URL: https://api.45.90.223.177.sslip.io
      - run: npm run typecheck -w @2pescrow/mobile
      - run: npm run check:mobile-parity
      # Blog copy is still missing French strings. Report it, but do not block the site, API, or APK.
      - run: npm run check:i18n
        continue-on-error: true
      - run: npm run check:android-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: 2pescrow-web
          path: apps/web/dist
          if-no-files-found: error

  # Runs only for a push whose message asks for it, so ordinary CI does not start a store build.
  ios-production:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ios-production]')
    name: Queue iOS production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Queue the iOS production build
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPO_APPLE_TEAM_ID: T4Y9L72F8B
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ] || [ -z "${EXPO_ASC_KEY_ID}" ] || [ -z "${EXPO_ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY are required." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          export EXPO_ASC_API_KEY_PATH="$key_path"
          npx --yes eas-cli@27.10.0 build --platform ios --profile production --non-interactive --no-wait

  # Store app bundle only. Preview APKs stay on the deploy workflow.
  android-production:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-production]')
    name: Queue Android Play internal release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Queue the Android production build and Play internal submit
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ] || [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "EXPO_TOKEN and PLAY_SERVICE_ACCOUNT_JSON are required." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_path"
          KEY_PATH="$key_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("eas.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          android = data.setdefault("submit", {}).setdefault("production", {}).setdefault("android", {})
          android["track"] = "internal"
          android["releaseStatus"] = "completed"
          android["serviceAccountKeyPath"] = os.environ["KEY_PATH"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          npx --yes eas-cli@27.10.0 build --platform android --profile production --non-interactive --auto-submit --no-wait
