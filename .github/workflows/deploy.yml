name: Deploy

on:
  push:
    branches:
      - cursor/api-start-and-prisma-generate

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-android:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: https://api.45.90.223.177.sslip.io
          EXPO_PUBLIC_WEB_ORIGIN: https://2pescrow.com
          EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID: "99700e35ab779a3fdd3918084d55bd02"
        run: npx expo prebuild --platform android --non-interactive
      - name: Build a debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 2pescrow-android
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  phone-ios:
    name: Build iOS app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate the iOS project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: https://api.45.90.223.177.sslip.io
          EXPO_PUBLIC_WEB_ORIGIN: https://2pescrow.com
          EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID: "99700e35ab779a3fdd3918084d55bd02"
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build for the iOS simulator
        working-directory: apps/mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -sdk iphonesimulator -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
