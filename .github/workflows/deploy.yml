name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # Preview is the installable internal build already in eas.json (Android APK, iOS ad hoc).
  # EAS compiles on Expo's free queue. This job waits so the run uploads the APK.
  # Runner env vars are not sent to EAS. The app reads production URLs from app.json extra.
  # eas-cli 27.10.0 has --non-interactive, --wait, and --json. Major 16 has those flags too,
  # but it exits in CI instead of creating an Android keystore when the Expo project has none.
  phone-android:
    name: Build Android app (EAS preview)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the Android preview on EAS
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Add the EXPO_TOKEN repository secret (an Expo access token) so EAS can authenticate." >&2
            exit 1
          fi
          npx --yes eas-cli@27.10.0 build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("eas-build.json").read_text(encoding="utf-8")
          positions = [p for p in (raw.find("{"), raw.find("[")) if p != -1]
          if not positions:
              raise SystemExit("EAS did not return JSON, so there is no APK to download.")
          build, _ = json.JSONDecoder().raw_decode(raw[min(positions):])
          if isinstance(build, list):
              build = build[0]
          status = str(build.get("status") or "").lower()
          if status and status != "finished":
              raise SystemExit("EAS Android build status was %s" % status)
          artifacts = build.get("artifacts") or {}
          url = artifacts.get("applicationArchiveUrl") or ""
          if not url:
              raise SystemExit("EAS Android build finished without applicationArchiveUrl.")
          Path("artifact-url.txt").write_text(url, encoding="utf-8")
          PY
      - name: Download the EAS APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --silent --show-error --fail --location --retry 3 --retry-delay 5 \
            --output dist/2pescrow-preview.apk \
            --url "$(cat artifact-url.txt)"
      - name: Verify the APK is an Android package
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          import zipfile
          path = "dist/2pescrow-preview.apk"
          with zipfile.ZipFile(path) as apk:
              names = apk.namelist()
          if not any(name == "AndroidManifest.xml" or name.endswith("/AndroidManifest.xml") for name in names):
              raise SystemExit("Downloaded file is not an Android APK")
          if "assets/index.android.bundle" not in names:
              raise SystemExit("APK is missing its JavaScript bundle and cannot run standalone")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 2pescrow-android
          path: apps/mobile/dist/2pescrow-preview.apk
          if-no-files-found: error
      - name: Build the Android app bundle for Play internal testing
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          path = Path("app.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          build_num = max(12, int((time.time() - 1767225600) // 60))
          data["expo"]["android"]["versionCode"] = build_num
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Stamped Android versionCode:", build_num)
          PY
          npx --yes eas-cli@27.10.0 build --platform android --profile production --non-interactive --wait --json > eas-production.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("eas-production.json").read_text(encoding="utf-8")
          positions = [p for p in (raw.find("{"), raw.find("[")) if p != -1]
          if not positions:
              raise SystemExit("EAS did not return JSON, so there is no Android App Bundle to submit.")
          build, _ = json.JSONDecoder().raw_decode(raw[min(positions):])
          if isinstance(build, list):
              build = build[0]
          status = str(build.get("status") or "").lower()
          if status and status != "finished":
              raise SystemExit("EAS Android production build status was %s" % status)
          build_id = build.get("id") or ""
          if not build_id:
              raise SystemExit("EAS Android production build finished without an id.")
          Path("production-build-id.txt").write_text(build_id, encoding="utf-8")
          PY
      - name: Submit the Android app bundle to Play internal testing
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Add the PLAY_SERVICE_ACCOUNT_JSON repository secret (the Play Console service account JSON key)." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_path"
          KEY_PATH="$key_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("eas.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          android = data.setdefault("submit", {}).setdefault("production", {}).setdefault("android", {})
          android["track"] = "internal"
          android["serviceAccountKeyPath"] = os.environ["KEY_PATH"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          npx --yes eas-cli@27.10.0 submit --platform android --profile production --id "$(cat production-build-id.txt)" --non-interactive --wait

  # Separate from the API deploy. An Apple credential failure must not skip Dokploy.
  # Builds the production iOS store archive and submits it directly to TestFlight.
  phone-ios:
    name: Build and submit iOS app (TestFlight)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the iOS app for TestFlight
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPO_APPLE_TEAM_ID: T4Y9L72F8B
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Add the EXPO_TOKEN repository secret (an Expo access token) so EAS can authenticate." >&2
            exit 1
          fi
          if [ -z "${EXPO_ASC_KEY_ID}" ] || [ -z "${EXPO_ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "Add the ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY repository secrets." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          export EXPO_ASC_API_KEY_PATH="$key_path"
          python3 - <<'PY'
          import json, time
          from pathlib import Path
          path = Path("app.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          build_num = max(12, int((time.time() - 1767225600) // 60))
          data["expo"]["ios"]["buildNumber"] = str(build_num)
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Stamped iOS buildNumber:", build_num)
          PY
          npx --yes eas-cli@27.10.0 build --platform ios --profile production --non-interactive --wait --json > eas-production.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("eas-production.json").read_text(encoding="utf-8")
          positions = [p for p in (raw.find("{"), raw.find("[")) if p != -1]
          if not positions:
              raise SystemExit("EAS did not return JSON, so there is no iOS archive to submit.")
          build, _ = json.JSONDecoder().raw_decode(raw[min(positions):])
          if isinstance(build, list):
              build = build[0]
          status = str(build.get("status") or "").lower()
          if status and status != "finished":
              raise SystemExit("EAS iOS production build status was %s" % status)
          build_id = build.get("id") or ""
          if not build_id:
              raise SystemExit("EAS iOS production build finished without an id.")
          Path("production-build-id.txt").write_text(build_id, encoding="utf-8")
          PY
      - name: Submit the iOS app to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "Add the ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY repository secrets." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          KEY_PATH="$key_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("eas.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          ios = data.setdefault("submit", {}).setdefault("production", {}).setdefault("ios", {})
          app_id = str(ios.get("ascAppId") or "")
          if not app_id.isdigit():
              raise SystemExit("Set eas.json submit.production.ios.ascAppId to the numeric App Store Connect app id before TestFlight submit can run.")
          ios["ascApiKeyPath"] = os.environ["KEY_PATH"]
          ios["ascApiKeyId"] = os.environ["ASC_KEY_ID"]
          ios["ascApiKeyIssuerId"] = os.environ["ASC_ISSUER_ID"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          npx --yes eas-cli@27.10.0 submit --platform ios --profile production --id "$(cat production-build-id.txt)" --non-interactive --wait

  web:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The new clients require the funding journal API and its migration before rollout.
    needs: [verify, api]
    steps:
      - name: Deploy this commit to the live website
        env:
          DOKPLOY_URL: http://45.90.223.177:3000
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_WEB_APPLICATION_ID: ${{ secrets.DOKPLOY_WEB_APPLICATION_ID }}
          WEB_APP_NAME: web2pescrow-vyov0a
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_API_KEY}" ]; then
            echo "Add the DOKPLOY_API_KEY repository secret from the Dokploy profile API token." >&2
            exit 1
          fi
          if [ -n "${DOKPLOY_WEB_APPLICATION_ID}" ]; then
            APPLICATION_ID="${DOKPLOY_WEB_APPLICATION_ID}"
          else
            projects=$(curl -fsS "${DOKPLOY_URL}/api/project.all" -H "x-api-key: ${DOKPLOY_API_KEY}")
            APPLICATION_ID=$(echo "${projects}" | jq -r --arg name "${WEB_APP_NAME}" '[.. | objects | select(.appName == $name) | .applicationId] | first // empty')
          fi
          if [ -z "${APPLICATION_ID}" ] || [ "${APPLICATION_ID}" = "null" ]; then
            echo "Could not find the Dokploy website app ${WEB_APP_NAME}." >&2
            echo "Set the DOKPLOY_WEB_APPLICATION_ID repository secret to that application's id." >&2
            exit 1
          fi
          app=$(curl -fsS "${DOKPLOY_URL}/api/application.one?applicationId=${APPLICATION_ID}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}")
          github_id=$(echo "${app}" | jq -r '.githubId // empty')
          build_path=$(echo "${app}" | jq -r '.buildPath // "/"')
          payload=$(jq -n \
            --arg applicationId "${APPLICATION_ID}" \
            --arg repository "2pescrow" \
            --arg owner "ochristianlove" \
            --arg buildPath "${build_path}" \
            --arg branch "${BRANCH}" \
            --arg githubId "${github_id}" \
            '{applicationId:$applicationId, repository:$repository, owner:$owner, buildPath:$buildPath, branch:$branch, triggerType:"push"} + (if $githubId == "" then {} else {githubId:$githubId} end)')
          curl -fsS -X POST "${DOKPLOY_URL}/api/application.saveGithubProvider" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "content-type: application/json" \
            -d "${payload}" > /dev/null
          curl -fsS -X POST "${DOKPLOY_URL}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg applicationId "${APPLICATION_ID}" --arg title "GitHub Actions ${SHA}" '{applicationId:$applicationId, title:$title}')" > /dev/null
          seen_running=0
          for _ in $(seq 1 60); do
            status=$(curl -fsS "${DOKPLOY_URL}/api/application.one?applicationId=${APPLICATION_ID}" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" | jq -r '.applicationStatus')
            echo "Website deploy status: ${status}"
            if [ "${status}" = "running" ]; then
              seen_running=1
            fi
            if [ "${status}" = "done" ] && [ "${seen_running}" = "1" ]; then
              exit 0
            fi
            if [ "${status}" = "error" ]; then
              exit 1
            fi
            sleep 15
          done
          echo "Website deploy did not finish." >&2
          exit 1

  api:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Backend migrations must be ready before the website; phone builds are independent artifacts.
    needs: verify
    steps:
      - name: Deploy this commit to the live API
        env:
          DOKPLOY_URL: http://45.90.223.177:3000
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_APP_NAME: we32pescrow-aivjfj
          DEFAULT_APPLICATION_ID: fD6Dob38RFNOuZreEZHKA
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_API_KEY}" ]; then
            echo "Add the DOKPLOY_API_KEY repository secret from the Dokploy profile API token." >&2
            exit 1
          fi
          projects=$(curl -fsS "${DOKPLOY_URL}/api/project.all" -H "x-api-key: ${DOKPLOY_API_KEY}" || echo "{}")
          APPLICATION_ID=$(echo "${projects}" | jq -r --arg name "${API_APP_NAME}" '[.. | objects | select(.appName == $name) | .applicationId] | first // empty')
          if [ -z "${APPLICATION_ID}" ] || [ "${APPLICATION_ID}" = "null" ]; then
            APPLICATION_ID="${DEFAULT_APPLICATION_ID}"
          fi
          app=$(curl -fsS "${DOKPLOY_URL}/api/application.one?applicationId=${APPLICATION_ID}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}")
          github_id=$(echo "${app}" | jq -r '.githubId // empty')
          build_path=$(echo "${app}" | jq -r '.buildPath // "/"')
          payload=$(jq -n \
            --arg applicationId "${APPLICATION_ID}" \
            --arg repository "2pescrow" \
            --arg owner "ochristianlove" \
            --arg buildPath "${build_path}" \
            --arg branch "${BRANCH}" \
            --arg githubId "${github_id}" \
            '{applicationId:$applicationId, repository:$repository, owner:$owner, buildPath:$buildPath, branch:$branch, triggerType:"push"} + (if $githubId == "" then {} else {githubId:$githubId} end)')
          curl -fsS -X POST "${DOKPLOY_URL}/api/application.saveGithubProvider" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "content-type: application/json" \
            -d "${payload}" > /dev/null
          curl -fsS -X POST "${DOKPLOY_URL}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg applicationId "${APPLICATION_ID}" --arg title "GitHub Actions ${SHA}" '{applicationId:$applicationId, title:$title}')" > /dev/null
          seen_running=0
          finished=0
          for _ in $(seq 1 40); do
            status=$(curl -fsS "${DOKPLOY_URL}/api/application.one?applicationId=${APPLICATION_ID}" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" | jq -r '.applicationStatus')
            echo "API deploy status: ${status}"
            if [ "${status}" = "running" ]; then
              seen_running=1
            fi
            if [ "${status}" = "done" ] && [ "${seen_running}" = "1" ]; then
              finished=1
              break
            fi
            if [ "${status}" = "error" ]; then
              exit 1
            fi
            sleep 15
          done
          if [ "${finished}" != "1" ]; then
            echo "API deploy did not finish." >&2
            exit 1
          fi
          # Dokploy "done" only means the container was replaced. Confirm the process answers before the run succeeds.
          health_url="https://api.45.90.223.177.sslip.io/health"
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "${health_url}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "API health check passed: ${health_url}"
              exit 0
            fi
            echo "API is not healthy yet."
            sleep 10
          done
          echo "API deploy finished but ${health_url} did not return ok." >&2
          exit 1
