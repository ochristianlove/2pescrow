name: iOS production build

on:
  workflow_dispatch:

jobs:
  ios:
    name: Queue iOS production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Queue the iOS production build
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          EXPO_APPLE_TEAM_ID: T4Y9L72F8B
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN}" ] || [ -z "${EXPO_ASC_KEY_ID}" ] || [ -z "${EXPO_ASC_ISSUER_ID}" ] || [ -z "${ASC_PRIVATE_KEY}" ]; then
            echo "EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, and ASC_PRIVATE_KEY are required." >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          export EXPO_ASC_API_KEY_PATH="$key_path"
          KEY_PATH="$key_path" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("eas.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          ios = data.setdefault("submit", {}).setdefault("production", {}).setdefault("ios", {})
          ios["ascApiKeyPath"] = os.environ["KEY_PATH"]
          ios["ascApiKeyId"] = os.environ["EXPO_ASC_KEY_ID"]
          ios["ascApiKeyIssuerId"] = os.environ["EXPO_ASC_ISSUER_ID"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          npx --yes eas-cli@27.10.0 build --platform ios --profile production --non-interactive --auto-submit --no-wait
